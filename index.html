<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecclesia CMS - Church Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      // Process shim for libraries that expect it
      window.process = { env: { API_KEY: "" } };
      
      // Detailed error logging for module failures
      window.onerror = function(msg, url, line, col, error) {
        console.error("Ecclesia Diagnostic Error:", msg, "\nUrl:", url, "\nLine:", line);
        const root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; padding: 20px;">
              <div style="background: white; padding: 3rem; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); max-width: 480px; border: 1px solid #e2e8f0;">
                <div style="font-size: 3rem; margin-bottom: 1.5rem;">⛪</div>
                <h1 style="color: #4f46e5; margin-bottom: 1rem; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.025em;">Restoring Connection...</h1>
                <p style="color: #64748b; margin-bottom: 2rem; font-size: 0.875rem; line-height: 1.6; font-weight: 500;">
                  We're having trouble mounting the Ecclesia portal. This is usually due to a temporary network lag.
                </p>
                <div style="background: #fff1f2; padding: 1rem; border-radius: 1rem; font-size: 0.7rem; color: #e11d48; margin-bottom: 2rem; border: 1px solid #fecdd3; overflow-wrap: break-word; font-family: monospace; text-align: left;">
                  ${msg}
                </div>
                <button onclick="location.reload()" style="background: #4f46e5; color: white; border: none; width: 100%; padding: 1.25rem; border-radius: 1.25rem; font-weight: 800; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; transition: transform 0.2s active:scale-95;">Refresh Sanctuary</button>
              </div>
            </div>`;
        }
      };
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
